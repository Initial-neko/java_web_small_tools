name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  java8:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Test
        run: xvfb-run -a mvn -B test
      - name: Verify offline package
        run: sh package.sh --online --skip-tests
